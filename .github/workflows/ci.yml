name: CI
on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # use the latest major available
      - uses: oven-sh/setup-bun@v2 # use the latest major available
      - uses: actions/setup-node@v4 # Next.js runs on Node
        with: { node-version: 22 }
      - run: bun install --frozen-lockfile
      - run: bun run ci
      - run: bun run typecheck
      - run: bun run build
        env:
          SKIP_ENV_VALIDATION: "1"
          NEXT_PUBLIC_SITE_URL: https://mifaretech.co.uk
          DATABASE_URL: postgresql://mock_user:mock_pass@ep-mock-ci.eu-central-1.aws.neon.tech/mock_db?sslmode=require
          DATABASE_URL_UNPOOLED: postgresql://mock_user:mock_pass@ep-mock-ci.eu-central-1.aws.neon.tech/mock_db?sslmode=require
          BETTER_AUTH_SECRET: ci_better_auth_secret_placeholder_123456789
          BETTER_AUTH_URL: https://mifaretech.co.uk
          IP_HASH_SALT: ci_ip_hash_salt_placeholder_123456789
          CRON_SECRET: ci_cron_secret_placeholder_123456789
          RESEND_API_KEY: re_placeholder_key_dev
          EMAIL_FROM: "Mifaretech <no-reply@mifaretech.co.uk>"
          SALES_INBOX: sales@mifaretech.co.uk
          RECAPTCHA_SECRET_KEY: ci_recaptcha_secret_key_placeholder
          NEXT_PUBLIC_RECAPTCHA_SITE_KEY: ci_recaptcha_site_key_placeholder
          CLOUDINARY_CLOUD_NAME: mifaretech_ci
          CLOUDINARY_API_KEY: "123456789012345"
          CLOUDINARY_API_SECRET: ci_cloudinary_secret_placeholder
          NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: mifaretech_ci
          NEXT_PUBLIC_WHATSAPP_NUMBER: "447448670925"
