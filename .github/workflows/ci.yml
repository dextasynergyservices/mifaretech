name: CI
on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # use the latest major available
      - uses: oven-sh/setup-bun@v2 # use the latest major available
      - uses: actions/setup-node@v4 # Next.js runs on Node
        with: { node-version: 22 }
      - run: bun install --frozen-lockfile
      - run: bun run ci
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
        env:
          SKIP_ENV_VALIDATION: "1"
          NEXT_PUBLIC_SITE_URL: https://example.com
